name: Update dashboard

on:
  schedule:
    - cron: "0 13 */2 * *"   # every 2 days, 8am ET (13:00 UTC; 9am ET during daylight time)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull numbers from Instantly
        env:
          INSTANTLY_KEY: ${{ secrets.INSTANTLY_KEY }}
        run: python fetch.py
      - name: Commit new numbers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json history.json
          git diff --cached --quiet || git commit -m "Update numbers $(date -u +%F)"
          git push
